<!doctype html>
<html lang="en" data-color-scheme="dark">
  <head>
    <meta charset="utf-8" />
    <title>The Outreach Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #121212;
        color: #e8eef6;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .panel {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .inner {
        max-width: 22rem;
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.5;
        color: rgba(232, 238, 246, 0.82);
      }
      button {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 0.75rem 1.25rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #22a52b;
        cursor: pointer;
        width: 100%;
      }
      .update {
        display: block;
        box-sizing: border-box;
        margin-bottom: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        padding: 0.75rem 1.25rem;
        color: #fff;
        background: #22a52b;
        font-weight: 700;
        text-decoration: none;
      }
      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: transparent;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.85rem;
        color: rgba(232, 238, 246, 0.65);
      }
    </style>
    <script>
      (function () {
        var PROD = "https://theoutreachproject.app/";
        var HEALTH = "https://theoutreachproject.app/api/health/mobile";
        var MIN_CHROMIUM = 111;

        function chromiumMajor() {
          var match = navigator.userAgent.match(/(?:Chrome|Chromium)\/(\d+)/i);
          return match ? parseInt(match[1], 10) : 0;
        }

        function setText(id, value) {
          var node = document.getElementById(id);
          if (node) node.textContent = value;
        }

        function go() {
          try {
            window.location.replace(PROD);
          } catch (e) {
            try {
              window.location.href = PROD;
            } catch (e2) {}
          }
        }

        function checkThenGo(retryEvenIfOld) {
          var major = chromiumMajor();
          if (!retryEvenIfOld && major && major < MIN_CHROMIUM) return;
          fetch(HEALTH, { cache: "no-store" })
            .then(function (r) {
              if (!r.ok) throw new Error("health");
              return r.json();
            })
            .then(function (body) {
              if (body && body.ok) go();
            })
            .catch(function () {});
        }

        window.addEventListener("load", function () {
          var major = chromiumMajor();
          if (major && major < MIN_CHROMIUM) {
            setText("title", "Update Android System WebView");
            setText(
              "message",
              "This tablet uses Chromium " + major + ". The Outreach Project requires version " +
                MIN_CHROMIUM + " or newer. Update Android System WebView (or Chrome), then reopen the app."
            );
            setText("version", "Detected WebView: " + major + " · Required: " + MIN_CHROMIUM + "+");
          } else {
            setText("title", "Unable to connect");
            setText(
              "message",
              "Check this device’s internet connection, update Android System WebView, then try again."
            );
            setText("version", major ? "Detected WebView: " + major : "WebView version unavailable");
            checkThenGo(false);
          }

          var btn = document.getElementById("retry");
          if (btn) btn.addEventListener("click", function () {
            checkThenGo(true);
          });
        });
      })();
    </script>
  </head>
  <body>
    <div class="panel" role="alert">
      <div class="inner">
        <h1 id="title">Checking compatibility&hellip;</h1>
        <p id="message">Checking the tablet’s WebView and connection.</p>
        <a
          class="update"
          href="market://details?id=com.google.android.webview"
        >Update Android System WebView</a>
        <a
          class="update secondary"
          href="market://details?id=com.android.chrome"
        >Update Google Chrome</a>
        <button class="secondary" type="button" id="retry">Try again</button>
        <p class="hint" id="version">WebView version unavailable</p>
      </div>
    </div>
  </body>
</html>
