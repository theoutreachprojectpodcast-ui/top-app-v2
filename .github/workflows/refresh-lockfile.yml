name: Refresh pnpm lockfile

on:
  push:
    branches: [qa]
    paths:
      - package.json
      - web/package.json
      - pnpm-workspace.yaml
      - patches/**
      - .github/workflows/refresh-lockfile.yml

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 2
