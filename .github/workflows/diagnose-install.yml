name: Diagnose pnpm install

on:
  push:
    branches: [qa]
  pull_request:
    branches: [QA]

jobs:
  diagnose-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies with full diagnostics
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile > pnpm-install.log 2>&1

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-log
          path: pnpm-install.log
          if-no-files-found: error
          retention-days: 2

      - name: Surface install failure
        if: steps.install.outcome == 'failure'
        run: |
          cat pnpm-install.log
          exit 1
