packages:
  - "web"

# Used by pnpm 10 installs and by CI audit (pnpm 11 via dlx — ignores package.json#pnpm).
onlyBuiltDependencies:
  - sharp

overrides:
  tar: ">=7.5.19"
  basic-ftp: ">=5.3.1"
  "@xmldom/xmldom": ">=0.8.13"
  # vercel pulls undici 8.x; GHSA-4cwx-7wf7-3272 is fixed in >=8.9.0
  undici: ">=8.9.0"
  path-to-regexp: ">=8.4.0"
  # brace-expansion 5.0.9+ fixes GHSA-rgw5-rvv9-x895; pair with minimatch >=10.2.5
  # (older minimatch throws "expand is not a function" under a blanket 5.x pin).
  minimatch: ">=10.2.5"
  brace-expansion: ">=5.0.9"
  # socks/proxy-agent via vercel — GHSA-mwp4-54f8-5fhr
  ip-address: ">=10.3.1"
  esbuild: ">=0.28.1"
  ws: ">=8.21.0"
  form-data: ">=4.0.6"
  next: ">=16.2.12"
  postcss: ">=8.5.18"
  # postcss via Next — GHSA-2v37-7h3g-55p8 is fixed in nanoid >=3.3.17
  nanoid: ">=3.3.17"
  js-yaml: ">=4.3.0"
  sharp: ">=0.35.0"
